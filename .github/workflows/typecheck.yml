name: Type Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  # mypy runs only here (it is not a prek hook; pyrefly handles type checking in
  # lint.yml). Keep in sync with the mypy version in the [dev] extra.
  MYPY_VERSION: "2.1.0"
  PYRIGHT_VERSION: "1.1.411"

# All jobs only read the repo; none need a writable GITHUB_TOKEN, so pin the
# default token to read-only.
permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      # Install the project with its typed extras into a venv so mypy resolves
      # the real numpy/scipy/h5py/plotly types (the runner's system Python is
      # externally managed, so --system installs are rejected). No
      # --ignore-missing-imports: imports resolve for real.
      - name: Install project with typed extras
        run: |
          uv venv
          uv pip install ".[dev,dashboard,plots]"

      # Point mypy at the venv interpreter so it sees the installed deps. The
      # [tool.mypy] exclude skips .venv/build so mypy does not crawl the
      # installed dependencies or the wheel-build copy of the source.
      - name: Run mypy
        run: >
          uvx --from "mypy==${{ env.MYPY_VERSION }}" mypy
          --python-executable .venv/bin/python
          --explicit-package-bases
          .

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      # pyright resolves types from the installed environment, so install the
      # project with its typed extras into a venv (the runner's system Python is
      # externally managed, so --system installs are rejected).
      - name: Install project with typed extras
        run: |
          uv venv
          uv pip install ".[dev,dashboard,plots]"

      - name: Run pyright
        run: >
          uvx pyright@${{ env.PYRIGHT_VERSION }}
          --pythonpath .venv/bin/python
