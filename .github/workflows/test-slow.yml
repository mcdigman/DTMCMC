name: Test (slow)

# Runs ONLY the heavy convergence batteries carrying the `slow` marker, and
# ONLY on the issue19-adaptive-flex branch. The per-push Test workflow excludes
# these with -m "not slow"; this job is their counterpart.
on:
  push:
    branches: [issue19-adaptive-flex]
  workflow_dispatch:

concurrency:
  group: test-slow-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  pytest-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install project with test extras
        run: |
          uv venv
          uv pip install ".[dev,plots]"

      - name: Run slow tests
        run: .venv/bin/python -m pytest -m slow
