# Dependabot version updates. GitHub's Dependabot *security* updates are
# already enabled for this repository; those only fire on advisories for
# vulnerable dependencies. This file covers routine bumps, which matters most
# for the workflows: every action is pinned to a full commit SHA, so nothing
# else moves those pins. Dependabot rewrites the SHA and keeps the trailing
# `# vX.Y.Z` comment in step.
#
# The Python dependencies in pyproject.toml are mostly declared as floors
# (`>=`) with no upper caps, so there is little for the pip ecosystem to raise;
# it is listed anyway to catch the plotly-stubs pin and any future pin or cap.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # One PR per month for routine action bumps rather than one per action.
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: development
