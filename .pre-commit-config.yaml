# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-docstring-first
  - id: check-json
  - id: check-toml
  - id: check-xml
  - id: check-ast
  - id: check-symlinks
  - id: check-vcs-permalinks
  - id: debug-statements
  - id: detect-aws-credentials
    args: [--allow-missing-credentials]
  - id: detect-private-key
  - id: mixed-line-ending
  - id: pretty-format-json
    args: [--autofix]
  - id: requirements-txt-fixer
  # Additional regression guards
  - id: check-merge-conflict
  - id: check-builtin-literals
  - id: check-illegal-windows-names
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable
  - id: destroyed-symlinks
  - id: forbid-submodules
  - id: fix-byte-order-marker
  - id: double-quote-string-fixer

- repo: https://github.com/asottile/pyupgrade
  rev: v3.21.2
  hooks:
  - id: pyupgrade
    args: [--keep-percent-format, --py314-plus]

- repo: https://github.com/bwhmather/ssort
  rev: 0.17.0
  hooks:
  - id: ssort

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.5
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: https://github.com/facebook/pyrefly-pre-commit
  rev: 1.2.0
  hooks:
  - id: pyrefly-check
    # pyrefly runs in an isolated environment, so the typed packages it must
    # resolve (those no longer in [tool.pyrefly].ignore-missing-imports) are
    # installed here: numpy/matplotlib/pytest ship py.typed, and scipy/h5py/pandas
    # types come from their stub packages. numba/astropy/PyIMRPhenomD
    # stay ignored in pyproject.toml (no installable type info). The dedicated
    # type-check CI (.github/workflows/typecheck.yml) still runs mypy.
    additional_dependencies:
      - numpy>=2.5.2
      - matplotlib>=3.11.1
      - pytest>=9.1.1
      - scipy-stubs
      - types-setuptools
      - plotly-stubs==0.1.4
      - h5py-stubs
      - pandas-stubs
      - types-PyYAML
      - jsonschema
      - corner
      - numba

- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint

- repo: local
  hooks:
  # RNG-stream discipline (methods-paper plan D5): numba's parallel=True is a
  # decorator kwarg, not an importable API path, so ruff TID251 cannot ban it;
  # this grep hook guards the single-threaded RNG-stream guarantee instead.
  - id: forbid-numba-parallel
    name: forbid numba parallel=True (D5 RNG-stream discipline)
    language: pygrep
    entry: parallel\s*=\s*True
    types: [python]
    # exclusions mirror the D5 whitelist exactly (plan §3): rng_helpers
    # (seeding), entropy_process (prange), tests
    exclude: ^(tests/|entropy_process\.py$|DTMCMC/rng_helpers\.py$)
