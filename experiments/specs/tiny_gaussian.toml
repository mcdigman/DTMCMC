name = 'tiny_gaussian'
seed = 42

[likelihood]
name = 'gaussian'
n_par = 3
cutoff = 5

[ladder]
kind = 'geometric'
n_chain = 6
n_cold = 1
T_cold = 1.0
T_min = 1.0
T_max = 100.0
n_inf_final = 1

[run]
n_steps = 512
block_size = 128
store_thin = 1
checkpoint_every_blocks = 2

[exchange]
strategy = 'sequential'
track_full_exchanges = false

[proposals.FisherJumpManager]
verbose_fisher = false

[proposals.DEJumpManager]
# tiny specs shrink this so buffer initialization is not the dominant cost
de_size = 512
